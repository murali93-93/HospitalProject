services:
  doctor:
   image: muraliraj1/doctor:v1
   container_name: doctor-ms
   ports:
    - "8082:8082"
   deploy:
    resources:
     limits:
      memory: 700m
   networks: 
    - hospital
  pateint:
   image: muraliraj1/patient:v1
   container_name: patient-ms
   ports:
    - "8083:8083"
   deploy:
    resources:
     limits:
      memory: 700m
   networks: 
    - hospital
  opservice:
   image: muraliraj1/opservice:v1
   container_name: opservice-ms
   ports:
    - "8084:8084"
   deploy:
    resources:
     limits:
      memory: 700m
   networks: 
    - hospital
networks:
 hospital:
  driver: "bridge"
 