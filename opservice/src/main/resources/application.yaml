spring:
  application:
    name: OPService
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://host.docker.internal:3306/hospital_db
    #url: jdbc:mysql://localhost:3306/hospital_db
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  config:
    import:
     - "application_qa.yml"
     - "application_prod.yml"
     - "application_dev.yml"
  profiles:
    active:
     - "dev"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    

server:
  port: 8084

build:
 version: "1.0"
  # url: jdbc:mysql://localhost:3306/hospital_db